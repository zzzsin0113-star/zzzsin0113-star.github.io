<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 214" width="320" height="214">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f2ee"/>
      <stop offset="0.55" stop-color="#c9ccc6"/>
      <stop offset="1" stop-color="#9ea29b"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d918a"/>
      <stop offset="0.45" stop-color="#eef0ea"/>
      <stop offset="1" stop-color="#7f837c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d28"/>
      <stop offset="1" stop-color="#121714"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#5f8f9c"/>
      <stop offset="0.35" stop-color="#22404a"/>
      <stop offset="0.75" stop-color="#0c1719"/>
      <stop offset="1" stop-color="#050909"/>
    </radialGradient>
    <pattern id="leather" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#171d19"/>
      <circle cx="1.5" cy="1.5" r="0.9" fill="#222a24"/>
      <circle cx="4.5" cy="4.5" r="0.9" fill="#222a24"/>
    </pattern>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="160" cy="204" rx="128" ry="7" fill="#000" opacity="0.35"/>

  <!-- top dials -->
  <rect x="52" y="40" width="44" height="16" rx="3" fill="url(#dial)"/>
  <g stroke="#6f736c" stroke-width="1">
    <path d="M57 42v12M62 42v12M67 42v12M72 42v12M77 42v12M82 42v12M87 42v12M92 42v12"/>
  </g>
  <rect x="210" y="38" width="38" height="18" rx="3" fill="url(#dial)"/>
  <g stroke="#6f736c" stroke-width="1">
    <path d="M215 40v14M220 40v14M225 40v14M230 40v14M235 40v14M240 40v14M245 40v14"/>
  </g>
  <rect x="223" y="30" width="12" height="9" rx="3" fill="#d9ff63"/>
  <rect x="256" y="44" width="28" height="12" rx="3" fill="url(#dial)"/>
  <g stroke="#6f736c" stroke-width="1"><path d="M261 46v8M266 46v8M271 46v8M276 46v8M281 46v8"/></g>

  <!-- viewfinder hump + top plate -->
  <path d="M122 56 L134 22 H186 L198 56 Z" fill="url(#silver)"/>
  <rect x="146" y="30" width="28" height="8" rx="2" fill="#2b322d"/>
  <rect x="24" y="54" width="272" height="30" rx="10" fill="url(#silver)"/>
  <text x="160" y="50" fill="#1c221e" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" text-anchor="middle">FUJIFILM</text>
  <text x="48" y="74" fill="#2d332f" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1">X-T30</text>

  <!-- body -->
  <rect x="24" y="76" width="272" height="116" rx="12" fill="url(#body)"/>
  <rect x="30" y="84" width="88" height="102" rx="8" fill="url(#leather)"/>
  <rect x="202" y="84" width="88" height="102" rx="8" fill="url(#leather)"/>
  <!-- strap lugs -->
  <rect x="16" y="82" width="10" height="14" rx="3" fill="#a6aaa3"/>
  <rect x="294" y="82" width="10" height="14" rx="3" fill="#a6aaa3"/>
  <!-- AF assist lamp -->
  <circle cx="266" cy="98" r="5" fill="#78b9ca" opacity="0.85"/>

  <!-- lens -->
  <circle cx="160" cy="134" r="64" fill="#0d1210"/>
  <circle cx="160" cy="134" r="60" fill="#1a201c" stroke="#3a423c" stroke-width="1.5"/>
  <circle cx="160" cy="134" r="56.5" fill="none" stroke="#2e3631" stroke-width="5" stroke-dasharray="2 2.6"/>
  <circle cx="160" cy="134" r="46" fill="#111613" stroke="#d9ff63" stroke-width="2"/>
  <circle cx="160" cy="134" r="38" fill="url(#glass)"/>
  <circle cx="160" cy="134" r="22" fill="none" stroke="#3d6370" stroke-width="1" opacity="0.7"/>
  <ellipse cx="146" cy="119" rx="11" ry="6" fill="#fff" opacity="0.22" transform="rotate(-30 146 119)"/>
  <circle cx="176" cy="148" r="3" fill="#fff" opacity="0.12"/>
  <path id="lensText" d="M111.5 134 A48.5 48.5 0 0 1 208.5 134" fill="none"/>
  <text fill="#9ea39c" font-family="Helvetica Neue, Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.4">
    <textPath href="#lensText" startOffset="50%" text-anchor="middle">SIGMA 18-50mm F2.8</textPath>
  </text>
</svg>
